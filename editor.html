<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RING-Bethesda — Editor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="content">
  <h1>RING-Bethesda — Project Timeline (Editor)</h1>
  <p class="sub">Internal working copy. Saves commit directly to GitHub — changes may take up to a minute to fully deploy, but appear here immediately.</p>
  <button id="addBtn" onclick="openModal()">+ Add entry</button>
  <button id="syncBtn" onclick="loadData(true)">↻ Reload from GitHub</button>
  <button id="printBtn" onclick="window.print()">Print / Save as PDF</button>
  <div class="filters" id="filters"></div>
  <div id="list"></div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
const catLabel = {qc:"QC & inspections", sched:"Schedule update", site:"Site work & selections", comm:"Client communication", auto:"Automatic message", pay:"Billing & payments"};
let data = [];
let activeFilter = "all";
let editingId = null; // null = adding new

function getAuth(){
  let auth = localStorage.getItem("ring_editor_secret");
  if(!auth){
    auth = prompt("Enter the editor passcode:");
    if(auth) localStorage.setItem("ring_editor_secret", auth);
  }
  return auth;
}

async function loadData(manual){
  try{
    const res = await fetch("data/entries.json", {cache:"no-store"});
    data = await res.json();
    renderAll();
    if(manual) toast("Reloaded from GitHub.");
  } catch(err){
    toast("Could not load data: " + err.message, true);
  }
}

function renderFilters(){
  const cats = ["all","qc","sched","site","comm","auto","pay"];
  const labels = {all:"All", qc:"QC & inspections", sched:"Schedule updates", site:"Site work & selections", comm:"Client communications", auto:"Automatic messages", pay:"Billing & payments"};
  const el = document.getElementById("filters");
  el.innerHTML = "";
  cats.forEach(c=>{
    const b = document.createElement("button");
    b.className = "chip" + (activeFilter===c ? " active" : "");
    b.textContent = labels[c];
    b.onclick = ()=>{ activeFilter = c; renderAll(); };
    el.appendChild(b);
  });
}

function renderList(){
  const el = document.getElementById("list");
  el.innerHTML = "";
  const sorted = [...data].sort((a,b)=>a.d.localeCompare(b.d));
  sorted.forEach(x=>{
    if(activeFilter !== "all" && x.cat !== activeFilter) return;
    const div = document.createElement("div");
    div.className = "entry " + x.cat;
    const photosHtml = (x.photos||[]).map(p=>`<img src="${p}" onclick="window.open(this.src)">`).join("");
    const filesHtml = (x.files||[]).map(f=>{
      const href = f.path || f.url;
      return `<a class="file-chip" href="${href}" target="_blank" rel="noopener">&#128206; ${f.name}</a>`;
    }).join("");
    div.innerHTML = `
      <div class="entry-actions">
        <button onclick="openModal(${x.id})">Edit</button>
        <button onclick="deleteEntry(${x.id})">Delete</button>
      </div>
      <div class="date">${x.d}</div>
      <div class="badge ${x.cat}">${catLabel[x.cat]}</div>
      <div class="desc">${x.desc}</div>
      <div class="src">${x.src}</div>
      <div class="photos">${photosHtml}</div>
      <div class="files">${filesHtml}</div>
      <div class="include-row">${x.include ? "☑" : "☐"} Include in client view</div>
    `;
    el.appendChild(div);
  });
}

function renderAll(){
  renderFilters();
  renderList();
}

function toast(msg, isError){
  const el = document.createElement("div");
  el.className = "toast" + (isError ? " error" : "");
  el.textContent = msg;
  document.getElementById("toastRoot").appendChild(el);
  setTimeout(()=>el.remove(), 5000);
}

// ---- Modal (add/edit) ----
let pendingNewPhotos = []; // {filename, dataBase64, previewUrl}
let pendingNewFiles = [];  // {name, filename, dataBase64}
let pendingRemovePhotos = [];
let pendingRemoveFiles = [];

function openModal(id){
  editingId = id || null;
  pendingNewPhotos = []; pendingNewFiles = []; pendingRemovePhotos = []; pendingRemoveFiles = [];
  const entry = id ? data.find(e=>e.id===id) : {d:"", cat:"site", desc:"", src:"", include:true, photos:[], files:[]};
  const root = document.getElementById("modalRoot");
  root.innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h3 style="margin-top:0;">${id ? "Edit entry" : "Add entry"}</h3>
        <label>Date / time</label>
        <input type="text" id="mDate" value="${escapeAttr(entry.d)}" placeholder="e.g. 2026-08-06, 3:00 PM">
        <label>Category</label>
        <select id="mCat">
          ${Object.entries(catLabel).map(([k,v])=>`<option value="${k}" ${entry.cat===k?"selected":""}>${v}</option>`).join("")}
        </select>
        <label>Description</label>
        <textarea id="mDesc">${escapeHtml(entry.desc)}</textarea>
        <label>Source</label>
        <input type="text" id="mSrc" value="${escapeAttr(entry.src)}">
        <label><input type="checkbox" id="mInclude" ${entry.include?"checked":""}> Include in client view</label>
        <label>Existing photos</label>
        <div class="photos" id="mExistingPhotos">
          ${(entry.photos||[]).map(p=>`<div class="photo-wrap" data-path="${escapeAttr(p)}"><img src="${p}"><button class="rm" onclick="removeExistingPhoto(this,'${p}')">×</button></div>`).join("") || "<span class='sub'>None</span>"}
        </div>
        <label>Add photos</label>
        <input type="file" id="mNewPhotos" accept="image/*" multiple onchange="handleNewPhotos(event)">
        <div class="photos" id="mNewPhotoPreview"></div>
        <label>Existing attachments</label>
        <div id="mExistingFiles">
          ${(entry.files||[]).map(f=>`<div data-path="${escapeAttr(f.path||f.url||'')}">📎 ${escapeHtml(f.name)} <button class="rm" style="position:static;width:auto;height:auto;border-radius:4px;padding:2px 6px;" onclick="removeExistingFile(this,'${escapeAttr(f.path||'')}')">remove</button></div>`).join("") || "<span class='sub'>None</span>"}
        </div>
        <label>Add attachment</label>
        <input type="file" id="mNewFiles" onchange="handleNewFiles(event)">
        <div class="modal-actions">
          <button onclick="closeModal()">Cancel</button>
          <button class="primary" onclick="saveModal()">Save</button>
        </div>
      </div>
    </div>
  `;
}

function closeModal(){ document.getElementById("modalRoot").innerHTML = ""; editingId = null; }
function escapeHtml(s){ return (s||"").replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function escapeAttr(s){ return (s||"").replace(/"/g, "&quot;"); }

function removeExistingPhoto(btn, path){
  pendingRemovePhotos.push(path);
  btn.closest(".photo-wrap").remove();
}
function removeExistingFile(btn, path){
  if(path) pendingRemoveFiles.push(path);
  btn.closest("div").remove();
}

function resizeImage(file, maxDim, quality){
  return new Promise((resolve)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => { img.src = e.target.result; };
    img.onload = () => {
      let {width, height} = img;
      if(width > maxDim || height > maxDim){
        if(width > height){ height = Math.round(height * maxDim / width); width = maxDim; }
        else { width = Math.round(width * maxDim / height); height = maxDim; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    reader.readAsDataURL(file);
  });
}

async function handleNewPhotos(event){
  const files = Array.from(event.target.files);
  for(const file of files){
    const dataUrl = await resizeImage(file, 1600, 0.82);
    const base64 = dataUrl.split(",")[1];
    const ext = "jpg";
    const filename = `id${editingId || "new"}_${Date.now()}_${Math.random().toString(36).slice(2,7)}.${ext}`;
    pendingNewPhotos.push({filename, dataBase64: base64, previewUrl: dataUrl});
  }
  renderNewPhotoPreview();
}

function renderNewPhotoPreview(){
  const el = document.getElementById("mNewPhotoPreview");
  el.innerHTML = pendingNewPhotos.map((p,i)=>`<div class="photo-wrap"><img src="${p.previewUrl}"><button class="rm" onclick="removePendingPhoto(${i})">×</button></div>`).join("");
}
function removePendingPhoto(i){ pendingNewPhotos.splice(i,1); renderNewPhotoPreview(); }

function handleNewFiles(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const base64 = e.target.result.split(",")[1];
    const ext = file.name.split(".").pop();
    const filename = `id${editingId || "new"}_${Date.now()}.${ext}`;
    pendingNewFiles.push({name: file.name, filename, dataBase64: base64});
    toast("Attachment ready: " + file.name);
  };
  reader.readAsDataURL(file);
}

async function saveModal(){
  const auth = getAuth();
  if(!auth) return;
  const entry = {
    d: document.getElementById("mDate").value,
    cat: document.getElementById("mCat").value,
    desc: document.getElementById("mDesc").value,
    src: document.getElementById("mSrc").value,
    include: document.getElementById("mInclude").checked,
  };
  if(editingId) entry.id = editingId;
  const body = {
    auth,
    action: editingId ? "updateEntry" : "addEntry",
    entry,
    newPhotos: pendingNewPhotos.map(p=>({filename:p.filename, dataBase64:p.dataBase64})),
    removePhotos: pendingRemovePhotos,
    newFiles: pendingNewFiles,
    removeFiles: pendingRemoveFiles,
  };
  toast("Saving...");
  try{
    const res = await fetch("/api/save", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
    const json = await res.json();
    if(!json.ok){
      if(res.status === 401){ localStorage.removeItem("ring_editor_secret"); }
      toast("Save failed: " + json.error, true);
      return;
    }
    // Optimistically merge into local data using local previews for new photos
    const savedEntry = {...json.entry};
    if(editingId){
      const idx = data.findIndex(e=>e.id===editingId);
      data[idx] = {...savedEntry, photos: [...savedEntry.photos.slice(0, savedEntry.photos.length - pendingNewPhotos.length), ...pendingNewPhotos.map(p=>p.previewUrl)]};
    } else {
      data.push({...savedEntry, photos: [...pendingNewPhotos.map(p=>p.previewUrl)]});
    }
    closeModal();
    renderAll();
    toast("Saved — committed to GitHub. Live site updates within ~30-60 seconds.");
  } catch(err){
    toast("Save failed: " + err.message, true);
  }
}

async function deleteEntry(id){
  if(!confirm("Delete this entry? This cannot be undone.")) return;
  const auth = getAuth();
  if(!auth) return;
  try{
    const res = await fetch("/api/save", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({auth, action:"deleteEntry", id})});
    const json = await res.json();
    if(!json.ok){ toast("Delete failed: " + json.error, true); return; }
    data = data.filter(e=>e.id!==id);
    renderAll();
    toast("Entry deleted.");
  } catch(err){
    toast("Delete failed: " + err.message, true);
  }
}

loadData();
</script>
</body>
</html>
